# Standalone debian container behind the docker:compose:debian:enter task.
# Run it from here with a bare `docker compose up -d`, or via mise.
name: mise-compose-debian

services:
  debian:
    image: debian:latest
    # Base distro images exit immediately with no command; sleep keeps the
    # container running so there is something to exec into.
    command: sleep infinity
    stdin_open: true
    tty: true
