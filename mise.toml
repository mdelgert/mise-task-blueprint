# Minimum version of mise required to run this configuration
min_version = "2026.8.0"

# Tools configuration for the project
[tools]
# node = "22"
# python = "3.13"

[task_config]
includes = ["tasks"]
excludes = [
    "tasks/**/*.meta.toml"
    # ,"tasks/omarchy"
    # ,"tasks/system"
    ]

[env]
MISE_BLUEPRINT = "1.0"
# MISE_VERBOSE = 1

# Exact custom metadata pattern.
# Top-level "_" is an arbitrary-data namespace in normal mise config files.
# [tasks.hello]
# description = "Simple task demonstrating native task config plus arbitrary custom metadata"
# run = "echo hello task"

# [_.tasks.hello]
# icon = "hand"
# risk = "low"
# anything_you_want = "test"
# enabled = true
# number = 123
# tags = ["example", "test"]
# category = "example"

# Root-level task (not under tasks/) so it sorts first in `mise tasks ls`
# and is quick to type: `mise run by-category <category>`.
[tasks.by-category]
description = "List mise tasks filtered by category prefix, e.g. system or omarchy"
alias = "cat"
file = "scripts/bash/tasks-by-category.sh"

[_.tasks.by-category]
icon = "list"
risk = "low"
enabled = true
number = 1
tags = ["tasks", "by-category"]
category = "root"
destructive = false
requires_sudo = false
interactive = false
anything_you_want = "root-level task kept out of tasks/ for quick access"

# `mise` alone still shows mise's own built-in CLI help (not configurable).
# `mise help` is the closest thing to a project-level help: it just lists
# every task with its description, always in sync since it reads live data.
[tasks.help]
description = "List all mise tasks with descriptions (project help)"
alias = "h"
run = "mise tasks ls"

[_.tasks.help]
icon = "help-circle"
risk = "low"
enabled = true
number = 2
tags = ["help", "tasks"]
category = "root"
destructive = false
requires_sudo = false
interactive = false
anything_you_want = "thin wrapper around mise tasks ls kept for discoverability"
