# Custom metadata sidecar.
# This file is excluded from mise task discovery by task_config.excludes.
# It deliberately uses the same [_.tasks.<name>] namespace supported
# by normal mise config files, while remaining arbitrary TOML for our catalog.

[_.tasks."dev:ssh:keygen"]
