["dev:python:version"]
description = "Run a mise-managed Python runtime and print its version"
tools = { python = "3.14" }
run = "python --version"

["dev:python:hello"]
description = "Run the hello-python.py sample script on a mise-managed Python runtime"
tools = { python = "3.14" }
file = "scripts/python/hello-python.py"

["dev:node:version"]
description = "Run a mise-managed Node runtime and print its version"
tools = { node = "24" }
run = "node --version"

["dev:node:hello"]
description = "Run the Node metadata example using a mise-managed Node runtime"
tools = { node = "24" }
file = "scripts/node/hello.mjs"

["dev:metadata:bash"]
description = "Return useful mise/task/project metadata as JSON from Bash"
tools = { jq = "1" }
file = "scripts/bash/task-metadata.sh"

["dev:metadata:python"]
description = "Return useful mise/task/project metadata as JSON from Python"
tools = { python = "3.14" }
file = "scripts/python/task_metadata.py"

["dev:metadata:all:bash"]
description = "Return all arbitrary [_.tasks.*] metadata as JSON through a Bash wrapper"
tools = { python = "3.14" }
file = "scripts/bash/catalog-metadata.sh"

["dev:metadata:all:python"]
description = "Return all arbitrary [_.tasks.*] metadata as JSON directly from Python"
tools = { python = "3.14" }
file = "scripts/python/catalog_metadata.py"

["dev:catalog:json"]
description = "Merge mise tasks ls --json with arbitrary [_.tasks.*] metadata"
tools = { python = "3.14" }
file = "scripts/python/catalog_json.py"
