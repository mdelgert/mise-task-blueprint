["dev:ssh:keygen"]
description = "Generate an Ed25519 SSH keypair; pass an optional output path"
file = "scripts/bash/ssh-keygen.sh"

["dev:age:keygen"]
description = "Generate an age identity and print only its public recipient"
tools = { age = "1" }
file = "scripts/bash/age-keygen.sh"

["dev:age:encrypt"]
alias = "enc"
description = "Encrypt a file with age; recipient is auto-derived from the local identity"
tools = { age = "1" }
file = "scripts/bash/age-encrypt.sh"

["dev:age:decrypt"]
alias = "dec"
description = "Decrypt an age file; identity is auto-derived from the local default identity"
tools = { age = "1" }
file = "scripts/bash/age-decrypt.sh"

["dev:sops:demo"]
description = "Create a local SOPS+age demo containing dummy secret data"
tools = { age = "1", sops = "3" }
file = "scripts/bash/sops-demo.sh"
