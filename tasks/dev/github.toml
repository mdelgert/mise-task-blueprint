["dev:github:auth"]
description = "Start GitHub CLI authentication instead of hard-coding a PAT"
raw = true
run = "gh auth login"

["dev:github:auth-status"]
description = "Show GitHub CLI authentication status"
run = "gh auth status"

["dev:github:user"]
description = "Call the authenticated GitHub REST API and show basic user metadata"
tools = { jq = "1" }
run = "gh api user | jq '{login, name, id, html_url}'"

["dev:github:repo"]
description = "Show GitHub repository information for the current repository"
dir = "{{cwd}}"
run = "gh repo view"

["dev:github:pat:help"]
description = "Explain the safe GitHub PAT workflow without printing or fabricating a token"
run = '''
cat <<'EOF'
GitHub Personal Access Tokens are issued by GitHub, not generated locally.

Recommended workflow:
  1. Prefer `gh auth login` for local CLI use.
  2. If a PAT is required, create a fine-grained PAT in GitHub.
  3. Grant only the repositories/resources and permissions actually required.
  4. Store the resulting token in a secret manager, SOPS-encrypted file, or CI secret.
  5. Never commit it or echo it from automation.

Useful tasks:
  mise dev:github:auth
  mise dev:github:auth-status
  mise dev:github:user
EOF
'''
