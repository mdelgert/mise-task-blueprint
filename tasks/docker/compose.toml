["docker:compose:config"]
description = "Validate/render the Compose configuration in the current directory"
dir = "{{cwd}}"
run = "docker compose config"

["docker:compose:up"]
description = "Start Compose services in the current directory"
dir = "{{cwd}}"
raw = true
run = "docker compose up"

["docker:compose:up-detached"]
description = "Start Compose services in detached mode"
dir = "{{cwd}}"
run = "docker compose up -d"

["docker:compose:down"]
description = "Stop/remove Compose services in the current directory"
dir = "{{cwd}}"
run = "docker compose down"

["docker:compose:ps"]
description = "List Compose services in the current directory"
dir = "{{cwd}}"
run = "docker compose ps"

["docker:compose:logs"]
description = "Follow Compose logs in the current directory"
dir = "{{cwd}}"
raw = true
run = "docker compose logs -f"

["docker:compose:pull"]
description = "Pull images for the current Compose project"
dir = "{{cwd}}"
run = "docker compose pull"

["docker:compose:build"]
description = "Build images for the current Compose project"
dir = "{{cwd}}"
run = "docker compose build"

["docker:compose:restart"]
description = "Restart services in the current Compose project"
dir = "{{cwd}}"
run = "docker compose restart"

["docker:compose:demo:up"]
description = "Start the included nginx + redis Compose demo"
run = "docker compose -f examples/docker-compose/demo/compose.yaml up -d"

["docker:compose:demo:ps"]
description = "Show status of the included Compose demo"
run = "docker compose -f examples/docker-compose/demo/compose.yaml ps"

["docker:compose:demo:logs"]
description = "Follow logs from the included Compose demo"
raw = true
run = "docker compose -f examples/docker-compose/demo/compose.yaml logs -f"

["docker:compose:demo:down"]
description = "Stop/remove the included Compose demo"
run = "docker compose -f examples/docker-compose/demo/compose.yaml down"

# Single-distro Compose demos. Each has its own Compose file and project, so
# entering one never starts or stops the other. The service runs
# `sleep infinity` so the container stays alive to be entered.

["docker:compose:ubuntu:enter"]
description = "Start the Ubuntu (latest) Compose container and open a shell inside it"
raw = true
run = "scripts/bash/compose-distro-enter.sh ubuntu"

["docker:compose:ubuntu:down"]
description = "Stop/remove the Ubuntu Compose container"
run = "docker compose -f examples/docker-compose/ubuntu/compose.yaml down"

["docker:compose:debian:enter"]
description = "Start the Debian (latest) Compose container and open a shell inside it"
raw = true
run = "scripts/bash/compose-distro-enter.sh debian"

["docker:compose:debian:down"]
description = "Stop/remove the Debian Compose container"
run = "docker compose -f examples/docker-compose/debian/compose.yaml down"
