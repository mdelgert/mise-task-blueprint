["docker:compose:config"]
description = "Validate/render the Compose configuration in the current directory"
dir = "{{cwd}}"
run = "docker compose config"

["docker:compose:up"]
description = "Start Compose services in the current directory"
dir = "{{cwd}}"
raw = true
run = "docker compose up"

["docker:compose:up-detached"]
description = "Start Compose services in detached mode"
dir = "{{cwd}}"
run = "docker compose up -d"

["docker:compose:down"]
description = "Stop/remove Compose services in the current directory"
dir = "{{cwd}}"
run = "docker compose down"

["docker:compose:ps"]
description = "List Compose services in the current directory"
dir = "{{cwd}}"
run = "docker compose ps"

["docker:compose:logs"]
description = "Follow Compose logs in the current directory"
dir = "{{cwd}}"
raw = true
run = "docker compose logs -f"

["docker:compose:pull"]
description = "Pull images for the current Compose project"
dir = "{{cwd}}"
run = "docker compose pull"

["docker:compose:build"]
description = "Build images for the current Compose project"
dir = "{{cwd}}"
run = "docker compose build"

["docker:compose:restart"]
description = "Restart services in the current Compose project"
dir = "{{cwd}}"
run = "docker compose restart"

["docker:compose:demo:up"]
description = "Start the included nginx + redis Compose demo"
run = "docker compose -f examples/docker-compose/compose.yaml up -d"

["docker:compose:demo:ps"]
description = "Show status of the included Compose demo"
run = "docker compose -f examples/docker-compose/compose.yaml ps"

["docker:compose:demo:logs"]
description = "Follow logs from the included Compose demo"
raw = true
run = "docker compose -f examples/docker-compose/compose.yaml logs -f"

["docker:compose:demo:down"]
description = "Stop/remove the included Compose demo"
run = "docker compose -f examples/docker-compose/compose.yaml down"
