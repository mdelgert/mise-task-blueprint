["docker:container:inspect"]
description = "Inspect a container; pass container name or ID"
usage = '''
arg "<container>" help="Container name or ID to inspect"
'''
# Inline `run` bodies receive declared args as $usage_<name>, not as $1.
run = 'docker inspect "$usage_container"'

["docker:container:logs"]
description = "Show recent container logs; pass container name/ID and optional line count"
file = "scripts/bash/docker-logs.sh"

["docker:container:shell"]
description = "Enter a running container using bash when present, otherwise sh"
raw = true
file = "scripts/bash/docker-shell.sh"

["docker:ubuntu:run"]
description = "Start a disposable interactive Ubuntu 24.04 shell and delete it on exit"
raw = true
run = "docker run --rm -it ubuntu:24.04 bash"

["docker:ubuntu:create"]
description = "Create/start a persistent example Ubuntu container named mise-ubuntu"
run = '''
if docker container inspect mise-ubuntu >/dev/null 2>&1; then
  echo "Container mise-ubuntu already exists; starting it if necessary."
  docker start mise-ubuntu >/dev/null || true
else
  docker run -d --name mise-ubuntu ubuntu:24.04 sleep infinity
fi
docker ps --filter name=mise-ubuntu
'''

["docker:ubuntu:enter"]
description = "Enter the persistent example Ubuntu container named mise-ubuntu"
raw = true
run = "docker exec -it mise-ubuntu bash"

["docker:ubuntu:stop"]
description = "Stop the persistent example Ubuntu container"
run = "docker stop mise-ubuntu"

["docker:ubuntu:remove"]
description = "Remove the persistent example Ubuntu container"
confirm = "Remove the example container mise-ubuntu?"
run = "docker rm -f mise-ubuntu"
