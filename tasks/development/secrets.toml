["development:ssh:keygen"]
description = "Generate an Ed25519 SSH keypair; pass an optional output path"
file = "scripts/bash/ssh-keygen.sh"

["development:age:keygen"]
description = "Generate an age identity and print only its public recipient"
tools = { age = "latest" }
file = "scripts/bash/age-keygen.sh"

["development:age:encrypt"]
description = "Encrypt a file with age"
tools = { age = "latest" }

usage = '''
arg "<recipient>" help="age public recipient"
arg "<input>" help="File to encrypt"
arg "[output]" help="Encrypted output filename"
'''

run = '''
recipient="${usage_recipient}"
input="${usage_input}"
output="${usage_output:-${usage_input}.age}"

age -r "$recipient" -o "$output" "$input"
echo "Encrypted: $input"
echo "Output:    $output"
'''

["development:age:decrypt"]
description = "Decrypt an age file: <identity-file> <input.age> [output]"
tools = { age = "latest" }
run = '''
identity="${1:-}"
input="${2:-}"
output="${3:-${input%.age}}"
if [[ -z "$identity" || -z "$input" ]]; then
  echo "Usage: mise run development:age:decrypt <identity-file> <input.age> [output]" >&2
  exit 2
fi
age -d -i "$identity" -o "$output" "$input"
echo "Wrote $output"
'''

["development:sops:demo"]
description = "Create a local SOPS+age demo containing dummy secret data"
tools = { age = "latest", sops = "latest" }
file = "scripts/bash/sops-demo.sh"
