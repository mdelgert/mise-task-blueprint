["network:ip"]
description = "Show network interfaces and IP addresses"
run = "ip -brief address"

["network:routes"]
description = "Show the routing table"
run = "ip route"

["network:dns"]
description = "Show systemd-resolved DNS status when available"
run = "resolvectl status 2>/dev/null || cat /etc/resolv.conf"

["network:ports"]
description = "Show listening TCP and UDP sockets"
run = "ss -tulpn"

["network:neighbors"]
description = "Show neighbor/ARP table"
run = "ip neigh"
