["network:http:headers"]
description = "Fetch HTTP response headers; defaults to https://example.com"
usage = '''
arg "[url]" help="URL to fetch headers from" default="https://example.com"
'''
# Inline `run` bodies receive declared args as $usage_<name>, not as $1.
run = 'curl -sSIL "$usage_url"'

["network:http:json"]
description = "Fetch JSON from a URL and pretty-print it; defaults to GitHub API root"
tools = { jq = "1" }
usage = '''
arg "[url]" help="URL returning JSON" default="https://api.github.com"
'''
# Inline `run` bodies receive declared args as $usage_<name>, not as $1.
run = 'curl -fsSL "$usage_url" | jq .'

["network:http:weather"]
description = "Get a compact REST weather response from wttr.in; pass a city such as Phoenix"
file = "scripts/bash/weather.sh"
