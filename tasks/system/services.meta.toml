# Custom metadata sidecar.
# This file is excluded from mise task discovery by task_config.excludes.
# It deliberately uses the same [_.tasks.<name>] namespace supported
# by normal mise config files, while remaining arbitrary TOML for our catalog.

[_.tasks."system:services:failed"]
icon = "computer"
risk = "low"
enabled = true
number = 95
tags = ["system", "services", "failed"]
category = "system"
destructive = false
requires_sudo = false
interactive = false
anything_you_want = "custom metadata for system:services:failed"

[_.tasks."system:services:running"]
icon = "computer"
risk = "low"
enabled = true
number = 96
tags = ["system", "services", "running"]
category = "system"
destructive = false
requires_sudo = false
interactive = false
anything_you_want = "custom metadata for system:services:running"

[_.tasks."system:services:user-running"]
