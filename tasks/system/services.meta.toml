# Custom metadata sidecar for services.toml.
# Excluded from mise task discovery by task_config.excludes in mise.toml.
#
# Uses the same [_.tasks.<name>] namespace mise reserves for arbitrary data in
# normal config files. Fields are validated by tools/validate-blueprint.py --
# see docs/CUSTOM-METADATA.md for the schema.

[_.tasks."system:services:failed"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "services", "failed"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "project"

[_.tasks."system:services:running"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "services", "running"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "project"

[_.tasks."system:services:user-running"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "services", "user-running"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "project"
