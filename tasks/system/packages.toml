["system:pkg:install-core"]
description = "Install baseline packages including ansible, nano, remmina, age, sops, curl, jq, Git, SSH and Docker"
file = "../../scripts/bash/install-packages.sh"

["system:pkg:update"]
description = "Update packages with the detected system package manager"
confirm = "Update installed system packages now?"
run = '''
if command -v pacman >/dev/null 2>&1; then
  sudo pacman -Syu
elif command -v apt-get >/dev/null 2>&1; then
  sudo apt-get update && sudo apt-get upgrade
elif command -v dnf >/dev/null 2>&1; then
  sudo dnf upgrade --refresh
else
  echo "Unsupported package manager" >&2
  exit 1
fi
'''

["system:pkg:search"]
description = "Search packages; pass a search term"
dir = "{{cwd}}"
run = '''
term="${1:-}"
if [[ -z "$term" ]]; then
  echo "Usage: mise run system:pkg:search <term>" >&2
  exit 2
fi
if command -v pacman >/dev/null 2>&1; then
  pacman -Ss "$term"
elif command -v apt-cache >/dev/null 2>&1; then
  apt-cache search "$term"
elif command -v dnf >/dev/null 2>&1; then
  dnf search "$term"
else
  echo "Unsupported package manager" >&2
  exit 1
fi
'''
