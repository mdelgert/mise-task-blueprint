# Custom metadata sidecar for files.toml.
# Excluded from mise task discovery by task_config.excludes in mise.toml.
#
# Uses the same [_.tasks.<name>] namespace mise reserves for arbitrary data in
# normal config files. Fields are validated by tools/validate-blueprint.py --
# see docs/CUSTOM-METADATA.md for the schema.

[_.tasks."system:files:largest-home"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "files", "largest-home"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "project"

[_.tasks."system:files:cwd-size"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "files", "cwd-size"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "caller"

[_.tasks."system:files:find-large"]
