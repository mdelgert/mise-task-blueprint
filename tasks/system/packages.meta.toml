# Custom metadata sidecar for packages.toml.
# Excluded from mise task discovery by task_config.excludes in mise.toml.
#
# Uses the same [_.tasks.<name>] namespace mise reserves for arbitrary data in
# normal config files. Fields are validated by tools/validate-blueprint.py --
# see docs/CUSTOM-METADATA.md for the schema.

[_.tasks."system:pkg:install-core"]
icon = "computer"
risk = "medium"
enabled = true
tags = ["system", "pkg", "install-core"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = true
interactive = false
cwd_scope = "project"

[_.tasks."system:pkg:update"]
icon = "computer"
risk = "high"
enabled = true
tags = ["system", "pkg", "update"]
category = "system"
destructive = false
requires_confirm = true
requires_sudo = true
interactive = false
cwd_scope = "project"

[_.tasks."system:pkg:search"]
icon = "computer"
risk = "low"
enabled = true
tags = ["system", "pkg", "search"]
category = "system"
destructive = false
requires_confirm = false
requires_sudo = false
interactive = false
cwd_scope = "caller"
